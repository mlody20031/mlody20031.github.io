name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AB75C2: ${{ secrets.AB75C2 }}
          B6D15F: ${{ secrets.B6D15F }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AB75C2', '')
          bm = os.environ.get('B6D15F', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- bc73963bf3cbf7d9502c5ea60cc014c2d9f3ac8ae55c65 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 027a7d042ab86a2e767533b861197f6c390269e2104c10dc -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
